[options]
# Server configuration
# admin_passwd will be set via environment variable
db_host = db-dev
db_port = 5432
db_user = odoo
# db_password will be set via environment variable DB_PASSWORD
db_name = False

# Addons paths
addons_path = /opt/odoo/odoo/addons,/opt/odoo/extra-addons,/opt/odoo/custom-addons

# HTTP configuration
http_port = 8069
longpolling_port = 8072

# Development settings
dev_mode = reload,qweb,werkzeug,xml

# Logging
log_level = debug
log_handler = :DEBUG
logfile = /var/log/odoo/odoo.log

# Workers (0 for development - easier debugging)
workers = 0
max_cron_threads = 1

# Security
list_db = True
proxy_mode = False

# Data directory
data_dir = /var/lib/odoo

# Limits (relaxed for development)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Database management
db_maxconn = 64

# Testing
test_enable = False
test_file = False
