[options]
# Server configuration
admin_passwd = ${ODOO_ADMIN_PASSWORD_PREPROD}
db_host = db-preprod
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD_PREPROD}
db_name = odoo_preprod

# Addons paths
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/custom-addons

# HTTP configuration
http_port = 8069
longpolling_port = 8072

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log

# Workers
workers = 3
max_cron_threads = 2

# Security
list_db = False
proxy_mode = True

# Data directory
data_dir = /var/lib/odoo

# Limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Database management
db_maxconn = 64

# Performance
osv_memory_count_limit = 0
osv_memory_age_limit = 1.0

# Session
session_timeout = 7200
