[options]
# Server configuration
admin_passwd = ${ODOO_ADMIN_PASSWORD_TEST}
db_host = db-test
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD_TEST}
db_name = False

# Addons paths
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons,/mnt/custom-addons

# HTTP configuration
http_port = 8069
longpolling_port = 8072

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log

# Workers
workers = 2
max_cron_threads = 1

# Security
list_db = True
proxy_mode = False

# Data directory
data_dir = /var/lib/odoo

# Limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Database management
db_maxconn = 64

# Testing
test_enable = True
